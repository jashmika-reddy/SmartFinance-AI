{% extends "base.html" %}

{% block title %}Sign In – SmartFinance AI{% endblock %}

{% block content %}
<div class="min-h-[80vh] flex flex-col justify-center items-center py-12 px-4 sm:px-6 lg:px-8">
    <div class="max-w-md w-full space-y-8 glass-card p-8 border border-slate-800 shadow-2xl relative overflow-hidden">
        
        <!-- Decorative Glow -->
        <div class="absolute -top-24 -left-24 w-48 h-48 bg-indigo-500/20 rounded-full blur-3xl pointer-events-none"></div>
        <div class="absolute -bottom-24 -right-24 w-48 h-48 bg-purple-500/20 rounded-full blur-3xl pointer-events-none"></div>

        <!-- Header -->
        <div class="text-center">
            <div class="w-12 h-12 mx-auto rounded-2xl bg-gradient-to-tr from-indigo-600 via-indigo-500 to-purple-500 flex items-center justify-center shadow-lg shadow-indigo-500/30 mb-4">
                <i class="fa-solid fa-chart-line text-white text-xl"></i>
            </div>
            <h2 class="text-2xl font-extrabold text-white tracking-tight">SmartFinance AI</h2>
            <p class="mt-2 text-sm text-slate-400">Intelligent Personal Financial Risk Management</p>
        </div>

        <!-- Form -->
        <form class="mt-6 space-y-5" method="POST" action="{{ url_for('auth.login') }}">
            <div>
                <label for="username_or_email" class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">Username or Email</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-slate-500">
                        <i class="fa-solid fa-user text-sm"></i>
                    </span>
                    <input id="username_or_email" name="username_or_email" type="text" required 
                           class="w-full pl-10 pr-4 py-2.5 bg-slate-900 border border-slate-700 rounded-xl text-slate-100 placeholder-slate-500 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all" 
                           placeholder="Enter username or email">
                </div>
            </div>

            <div>
                <label for="password" class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">Password</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-slate-500">
                        <i class="fa-solid fa-lock text-sm"></i>
                    </span>
                    <input id="password" name="password" type="password" required 
                           class="w-full pl-10 pr-4 py-2.5 bg-slate-900 border border-slate-700 rounded-xl text-slate-100 placeholder-slate-500 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all" 
                           placeholder="••••••••">
                </div>
            </div>

            <button type="submit" 
                    class="w-full py-3 px-4 border border-transparent rounded-xl text-sm font-semibold text-white bg-indigo-600 hover:bg-indigo-500 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 shadow-lg shadow-indigo-600/30 transition-all flex items-center justify-center space-x-2">
                <span>Sign In to Dashboard</span>
                <i class="fa-solid fa-arrow-right text-xs"></i>
            </button>
        </form>

        <!-- Examiner / Evaluation Demo Account Fast Fillers -->
        <div class="pt-4 border-t border-slate-800">
            <p class="text-xs font-semibold text-slate-400 mb-2.5 flex items-center justify-between">
                <span><i class="fa-solid fa-flask-vial mr-1 text-indigo-400"></i> Examiner Demo Profiles:</span>
                <span class="text-[10px] text-slate-500 font-normal">Click to auto-fill</span>
            </p>
            <div class="grid grid-cols-1 gap-2">
                <button type="button" onclick="fillDemo('sarah_resilient', 'password123')" 
                        class="text-left px-3 py-2 rounded-lg bg-slate-800/80 hover:bg-slate-800 border border-emerald-500/30 text-xs flex items-center justify-between transition-colors">
                    <span class="text-emerald-400 font-medium">Sarah Resilient (Low Risk • 88 Score)</span>
                    <i class="fa-solid fa-circle-check text-emerald-500 text-[11px]"></i>
                </button>
                <button type="button" onclick="fillDemo('alex_stressed', 'password123')" 
                        class="text-left px-3 py-2 rounded-lg bg-slate-800/80 hover:bg-slate-800 border border-rose-500/30 text-xs flex items-center justify-between transition-colors">
                    <span class="text-rose-400 font-medium">Alex Stressed (Critical Debt • 32 Score)</span>
                    <i class="fa-solid fa-triangle-exclamation text-rose-500 text-[11px]"></i>
                </button>
                <button type="button" onclick="fillDemo('david_moderate', 'password123')" 
                        class="text-left px-3 py-2 rounded-lg bg-slate-800/80 hover:bg-slate-800 border border-amber-500/30 text-xs flex items-center justify-between transition-colors">
                    <span class="text-amber-400 font-medium">David Moderate (Moderate Risk • 64 Score)</span>
                    <i class="fa-solid fa-shield text-amber-500 text-[11px]"></i>
                </button>
            </div>
        </div>

        <div class="text-center text-xs text-slate-400">
            Don't have an account? 
            <a href="{{ url_for('auth.register') }}" class="font-semibold text-indigo-400 hover:text-indigo-300 ml-1">Create one now</a>
        </div>
    </div>
</div>

<script>
function fillDemo(username, password) {
    document.getElementById('username_or_email').value = username;
    document.getElementById('password').value = password;
}
</script>
{% endblock %}

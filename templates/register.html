{% extends "base.html" %}

{% block title %}Register – SmartFinance AI{% endblock %}

{% block content %}
<div class="min-h-[85vh] flex flex-col justify-center items-center py-10 px-4 sm:px-6 lg:px-8">
    <div class="max-w-xl w-full space-y-6 glass-card p-8 border border-slate-800 shadow-2xl relative">

        <!-- Header -->
        <div class="text-center">
            <h2 class="text-2xl font-extrabold text-white tracking-tight">Create SmartFinance Account</h2>
            <p class="mt-1 text-sm text-slate-400">Set up your personal financial profile and begin AI risk tracking</p>
        </div>

        <form class="space-y-4" method="POST" action="{{ url_for('auth.register') }}">
            
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1.5">Username *</label>
                    <input name="username" type="text" required 
                           class="w-full px-3.5 py-2.5 bg-slate-900 border border-slate-700 rounded-xl text-slate-100 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none" 
                           placeholder="johndoe">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1.5">Full Name</label>
                    <input name="full_name" type="text" 
                           class="w-full px-3.5 py-2.5 bg-slate-900 border border-slate-700 rounded-xl text-slate-100 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none" 
                           placeholder="John Doe">
                </div>
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1.5">Email Address *</label>
                <input name="email" type="email" required 
                       class="w-full px-3.5 py-2.5 bg-slate-900 border border-slate-700 rounded-xl text-slate-100 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none" 
                       placeholder="john@example.com">
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1.5">Password *</label>
                    <input name="password" type="password" required 
                           class="w-full px-3.5 py-2.5 bg-slate-900 border border-slate-700 rounded-xl text-slate-100 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none" 
                           placeholder="Min 6 characters">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1.5">Confirm Password *</label>
                    <input name="confirm_password" type="password" required 
                           class="w-full px-3.5 py-2.5 bg-slate-900 border border-slate-700 rounded-xl text-slate-100 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none" 
                           placeholder="Re-enter password">
                </div>
            </div>

            <!-- Initial Financial Benchmark Parameters -->
            <div class="pt-2 border-t border-slate-800">
                <span class="text-xs font-bold text-indigo-400 uppercase tracking-wider block mb-3">Financial Profile Baseline</span>
                
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs text-slate-400 mb-1">Monthly Gross Income ($)</label>
                        <input name="monthly_income" type="number" step="100" value="5000" 
                               class="w-full px-3.5 py-2 bg-slate-900 border border-slate-700 rounded-xl text-slate-100 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-xs text-slate-400 mb-1">Liquid Savings / Cash ($)</label>
                        <input name="liquid_savings" type="number" step="100" value="12000" 
                               class="w-full px-3.5 py-2 bg-slate-900 border border-slate-700 rounded-xl text-slate-100 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                    </div>
                </div>

                <div class="mt-3">
                    <label class="block text-xs text-slate-400 mb-1">Risk Tolerance</label>
                    <select name="risk_tolerance" class="w-full px-3.5 py-2 bg-slate-900 border border-slate-700 rounded-xl text-slate-100 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                        <option value="conservative">Conservative (Low volatility preference)</option>
                        <option value="moderate" selected>Moderate (Balanced wealth building)</option>
                        <option value="aggressive">Aggressive (High growth risk tolerance)</option>
                    </select>
                </div>
            </div>

            <button type="submit" 
                    class="w-full py-3 px-4 rounded-xl text-sm font-semibold text-white bg-indigo-600 hover:bg-indigo-500 shadow-lg shadow-indigo-600/30 transition-all flex items-center justify-center space-x-2">
                <span>Create Account & Launch</span>
                <i class="fa-solid fa-arrow-right text-xs"></i>
            </button>
        </form>

        <div class="text-center text-xs text-slate-400">
            Already registered? 
            <a href="{{ url_for('auth.login') }}" class="font-semibold text-indigo-400 hover:text-indigo-300 ml-1">Sign in here</a>
        </div>
    </div>
</div>
{% endblock %}
